schema_version: "1.1"
name: propose-does-not-auto-apply
description: >-
  A single request that asks to plan AND build a work item in one go spans
  /sk:propose, /sk:continue and /sk:apply. Only /sk:propose is right — it writes
  proposal.md and stops; the request authorising more does not carry the run
  into the spec, the tasks or implementation.
tags: [core]
context:
