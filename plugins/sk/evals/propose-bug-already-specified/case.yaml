name: propose-bug-already-specified
description: >-
  A Bug whose expected result a scenario in sk/specs/ already states is code
  drifting from a spec that is still right: /sk:propose writes nothing under
  sk/changes/, names that scenario, and says the fix is a commit or PR with
  AB#<id> whose regression test comes from it.
