schema_version: "1.1"
name: propose-records-out-of-scope
description: >-
  A comment on the work item cuts part of the scope. /sk:propose records it
  under ## Out of scope with the comment as its source — so a dropped item
  cannot be mistaken later for a forgotten one — and writes no spec.
tags: [core]
context:
  scaffold_script: fixture.sh
